<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07131d"><title>Live Fishing RNG</title><link rel="stylesheet" href="./styles/main.css"></head><body><main id="app" class="game"><header class="hud"><section class="brand"><span class="logo">🎣</span><div><b>LIVE FISHING RNG</b><small id="connectionStatus">PAINEL...</small></div></section><section class="session"><span>CAPTURAS</span><b id="totalCatches">0</b></section><section class="session"><span>JOGADORES</span><b id="totalPlayers">0</b></section><button id="fullscreenBtn" class="hud-btn" aria-label="Tela cheia">⛶</button></header><section id="scene" class="scene"><div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div></div><div class="shore"><div class="dock"></div><div id="fisherStage" class="fisher-stage"><div id="viewerTag" class="viewer-tag">@viewer</div><div class="fisher"><i class="head"></i><i class="body"></i><i class="arm"></i><i class="rod"></i><i class="line"></i></div></div></div><div class="water"><div class="wave w1"></div><div class="wave w2"></div><div id="fishReveal" class="fish-reveal"><span id="fishEmoji">🐟</span><strong id="fishName">Peixe</strong><small id="fishRarity">COMUM</small><b id="fishPoints">+10</b></div></div><aside class="rank-card"><div class="rank-head"><span>🏆 RANK AO VIVO</span><small>TOP 5</small></div><ol id="rankList"></ol></aside><aside class="feed-card"><div class="feed-head">ÚLTIMAS PESCAS</div><div id="catchFeed"></div></aside><button id="catalogBtn" class="catalog-btn">🐠 CATÁLOGO <b id="catalogProgress">0/10</b></button><div id="rareBanner" class="rare-banner"></div></section><footer class="livebar"><div class="live-copy"><b>💬 COMENTE PARA PESCAR</b><span>Presentes aumentam a sorte, sem garantir o prêmio máximo.</span></div><div class="rule-chip"><i>💬</i><span>COMENTÁ
